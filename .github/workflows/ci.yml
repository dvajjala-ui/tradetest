name: .NET verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build TradeTest.slnx --configuration Release --nologo
      - run: dotnet test TradeTest.slnx --configuration Release --no-build --nologo
