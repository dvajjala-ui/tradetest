name: tradetest

services:
  api:
    image: tradetest-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TRADETEST_API_TOKEN: ${TRADETEST_API_TOKEN:?Run python3 scripts/init-runtime-env.py first}
      TRADETEST_ALLOWED_ORIGINS: ${TRADETEST_ALLOWED_ORIGINS:-http://127.0.0.1:5173;http://localhost:5173}
    ports:
      - "127.0.0.1:${TRADETEST_API_PORT:-5080}:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
